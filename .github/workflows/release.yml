name: release

# Maintainer pushes a tag `v<plugin.yaml version>` (e.g. `v0.4.0`) to cut a
# release. The job fails closed unless the tag matches plugin.yaml, so a
# mistyped tag can never publish a mismatched release. Uses pip, not uv:
# three tiny installs, no lockfile — a new toolchain buys nothing here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Tag must match plugin.yaml version
        run: |
          plugin_version="v$(grep '^version:' plugin.yaml | awk '{print $2}')"
          if [ "$plugin_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != plugin.yaml $plugin_version"
            exit 1
          fi
          echo "releasing $GITHUB_REF_NAME (matches plugin.yaml)"

      - name: Tagged commit must be on master with passing checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The ruleset blocks push to master unless required checks pass
          # ("Greptile Review"). Requiring the tagged commit to be an ancestor
          # of origin/master therefore guarantees it was merged and validated —
          # a broken/unmerged commit cannot be tagged and published.
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tagged commit $GITHUB_SHA is not on origin/master"
            exit 1
          fi
          echo "$GITHUB_SHA is on origin/master (required checks passed at merge)"

      - name: Quick gates (no Hermes install needed)
        run: |
          python -m py_compile __init__.py checks.py constants.py
          pip install "pyyaml==6.0.3"
          python tools/check_no_mutation.py --selftest
          python tools/check_no_mutation.py
          python tools/check_self_claim.py
          python tools/check_skill_version_bump.py
          python tools/test_skill_counts.py
          python tools/check_version_consistency.py

      - name: Generate changelog
        run: |
          python tools/gen_changelog.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Check if there are staged changes before committing
          if git diff --cached --quiet; then
            echo "no changelog changes"
          else
            git commit -m "chore: update CHANGELOG.md for $GITHUB_REF_NAME"
            # Push to a branch, not master (ruleset requires checks on master)
            git push origin "HEAD:refs/heads/changelog-update-${GITHUB_REF_NAME}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
